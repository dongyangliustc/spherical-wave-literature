# Risk and counterevidence registry.
# Records here capture limitations, failed assumptions, and implementation risks.
risks:
  - id: "risk-fock-exchange-nonlocal-momentum-space"
    claim: "Nonlocal Fock exchange cannot be represented as a simple local V(|p-q|) kernel."
    evidence: "Phase G decision guide notes mismatch between J-K specification and local KS-potential implementation."
    project_impact: "Separable potential and Schwinger layers must distinguish DFT-local and HF-exchange tiers."
    status: "active"

  - id: "risk-stieltjes-beta-limitation"
    claim: "L2 Stieltjes-Tchebycheff reconstruction does not directly provide beta parameters or resolved angular distributions."
    evidence: "Existing beginner and comparison notes identify lack of asymptotic angular information as a key limitation."
    project_impact: "Benchmark strategy must not rely on Stieltjes-style total cross sections alone for angular modules."
    status: "active"

  - id: "risk-ch2o-no-direct-cacelli-benchmark"
    claim: "CH2O lacks a directly matched Cacelli benchmark in the current library."
    evidence: "Phase G decision guide recommends H2 -> N2 -> C2H2 before CH2O."
    project_impact: "CH2O should not be used as a hard Gate until an external reference or ePolyScat comparison is available."
    status: "active"
